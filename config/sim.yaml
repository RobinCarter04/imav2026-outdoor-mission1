# Simulation profile — ArduPilot SITL on this laptop (scripts/launch_sim.sh).
# Site geometry (areas, fence, corridors, targets) lives in config/sites/<site>.yaml — this file only
# says HOW we connect and where frames come from, so any site can be flown in SITL.
vehicle:
  connection: tcp:127.0.0.1:5762   # SITL SERIAL1 TCP port (--connection overrides, e.g. a second instance)
camera:
  source: replay                    # replay | synthetic
  replay_file: data/datasets/sample_downward.mp4
detection:
  placeholder: {radius_m: 40.0, period_s: 0.5, noise_m: 1.5}
